{% extends "main_app/base.html" %}

{% block title %}Connexion — Budgeton{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge fw-semibold mb-2" style="background: #f6e4d4; color: #c45c3e;">Bienvenue</span>
                    <h1 class="h4 fw-bold mb-1">Connexion</h1>
                    <p class="small mb-0" style="color: #8a6e5d;">Retrouve ton budget en un instant</p>
                </div>
                {% if form.errors %}
                    <div class="alert alert-danger rounded-4">Identifiant ou mot de passe incorrect.</div>
                {% endif %}
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Mot de passe</label>
                        <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
