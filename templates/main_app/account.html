{% extends "main_app/base.html" %}

{% block title %}Mon compte — Budgeton{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 fw-bold mb-3">Mon compte</h1>
                <dl class="row mb-4">
                    <dt class="col-sm-4 text-muted">Identifiant</dt>
                    <dd class="col-sm-8">{{ user.username }}</dd>
                    <dt class="col-sm-4 text-muted">E-mail</dt>
                    <dd class="col-sm-8">{{ user.email|default:"—" }}</dd>
                </dl>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">Se déconnecter</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
