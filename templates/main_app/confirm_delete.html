{% extends "main_app/base.html" %}

{% block title %}Confirmer la suppression — Budgeton{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0">
            <div class="card-body p-4 p-md-5 text-center">
                <h1 class="h4 fw-bold mb-3">Supprimer {{ object_kind }} ?</h1>
                <p class="mb-1 fw-semibold">{{ object.name }}</p>
                <p class="mb-4" style="color: #8a6e5d;">
                    {{ object.amount|floatformat:2 }} € · {{ object.date|date:"d/m/Y" }}
                </p>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{{ request.GET.next|default:'/' }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
